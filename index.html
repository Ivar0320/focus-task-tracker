<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task & Productivity Tracker</title>
  <!-- Chart.js（グラフ描画用ライブラリ）の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="header">
    <div class="header-inner">
      <h1>Focus & Task Tracker</h1>
      <p id="current-date" class="current-date"></p>
    </div>
  </header>

  <main class="main-container">
    
    <!-- 左カラム：タイマー ＆ タスク追加フォーム -->
    <aside class="sidebar">
      
      <!-- ポモドーロ・タイマーカード -->
      <section class="card timer-card">
        <h2>Pomodoro Timer</h2>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="start-btn" class="btn btn-primary">Start</button>
          <button id="pause-btn" class="btn btn-secondary" disabled>Pause</button>
          <button id="reset-btn" class="btn btn-danger">Reset</button>
        </div>
        <p class="timer-status" id="timer-status">作業時間 (25分)</p>
      </section>

      <!-- タスク入力フォーム -->
      <section class="card form-card">
        <h2>新規タスク追加</h2>
        <form id="task-form">
          <div class="form-group">
            <label for="task-title">タスク名 <span class="required">必須</span></label>
            <input type="text" id="task-title" placeholder="例: Reactの環境構築" required>
          </div>
          
          <div class="form-group">
            <label for="task-category">カテゴリ</label>
            <select id="task-category">
              <option value="work">Work (仕事・開発)</option>
              <option value="study">Study (学習)</option>
              <option value="personal">Personal (プライベート)</option>
            </select>
          </div>

          <button type="submit" class="btn btn-accent">タスクを追加</button>
        </form>
      </section>

    </aside>

    <!-- 右カラム：タスク一覧 ＆ アナリティクス -->
    <section class="content-area">
      
      <!-- タスク一覧カード -->
      <article class="card task-card">
        <div class="task-header">
          <h2>タスク一覧</h2>
          <!-- フィルターボタン -->
          <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all">すべて</button>
            <button class="filter-btn" data-filter="active">未完了</button>
            <button class="filter-btn" data-filter="completed">完了済み</button>
          </div>
        </div>

        <!-- タスクリスト描画枠 -->
        <ul id="task-list" class="task-list">
          <!-- JSで動的に <li> を追加します -->
        </ul>
      </article>

      <!-- 生産性アナリティクス（グラフ）カード -->
      <article class="card analytics-card">
        <h2>生産性アナリティクス</h2>
        <div class="chart-container">
          <canvas id="productivity-chart"></canvas>
        </div>
      </article>

    </section>

  </main>

  <script src="./js/script.js"></script>
</body>
</html>
